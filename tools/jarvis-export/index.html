<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wisp Jarvis Orb</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; }
    /* Body background TRANSPARENT by construction (ticket-65 real-machine
       follow-up, 2026-11-07): the Wisp host window is a transparent WebView2
       overlay (orb_windows.go DefaultBackgroundColor a=0), so the page's own
       CSS must not paint ANY backdrop - the pixels outside the orb are the
       window's transparency, full stop. The injected belt in orbasset.go
       STAYS: it is the siri page's transparency mechanism too and costs
       nothing. */
    body { overflow: hidden; background: transparent; }
    /* PURE PARTICLES (ticket 65 pure-particle leg, 2026-11-08): the owner's
       ruling verbatim - no sphere body, no visible frame, no backdrop; the
       particles float by themselves, like Jarvis. The previous leg's dark
       circular in-page backdrop div is GONE from this template (the owner
       rejected the disc itself). The visibility fix lives in the
       blending mode instead, applied at build time by the
       wisp-jarvis-normal-blending plugin in vite.config.mjs: the upstream's
       AdditiveBlending ADDS particle color onto the backdrop, so over white
       surfaces the low-alpha particle edges clamp toward white (the owner's
       JARVIS-PRODUCT-REAL.png wash-out); NormalBlending composites each
       particle by its own alpha over whatever is behind it, so the same
       saturated cyan palette reads cyan on white AND on dark - no disc, no
       background, particles only. Nothing else changed: particle counts,
       orbit geometry and the transparency architecture (corners keep showing
       the desktop) are pinned by the existing teeth. */
    #root { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/entry.tsx"></script>
</body>
</html>
