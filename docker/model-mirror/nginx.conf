# model-mirror (SPEC-11 §4): bytes-only model mirror for wisp.
# Hashes never live here - they come exclusively from the in-repo C29 signed
# manifest (D33/F3). Static file serving gives HTTP Range support natively.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex on;                # dev convenience: browse /<model-id>/
    sendfile on;

    add_header Cache-Control "no-store" always;
    add_header X-Wisp-Mirror "bytes-only" always;

    # <model-id>/<file-name> layout, matching internal/models.BuildCandidates:
    #   <mirror-base>/<model-id>/<file-name>
    location / {
        try_files $uri =404;
    }
}
