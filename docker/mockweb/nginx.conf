# mock-web nginx config: static fixtures + the redirect shapes 票 22 names.
# Served on :18084 by docker/compose.test.yml (service mock-web). The huge
# body file is generated at container start (compose `command`), so the
# repo carries no multi-MB fixture bytes.

server {
    listen 18084;
    server_name mock-web.test;

    root /usr/share/nginx/html;
    default_type text/html;

    # redirect chain 1 -> 2 -> 3 -> clean
    location = /redirect/1 { return 302 /redirect/2; }
    location = /redirect/2 { return 302 /redirect/3; }
    location = /redirect/3 { return 302 /clean.html; }

    # the guard must refuse to FOLLOW each of these (SPEC-06 §6.3):
    location = /redirect/file      { return 302 file:///etc/passwd; }
    location = /redirect/private   { return 302 http://169.254.169.254/latest/meta-data/; }
    location = /redirect/loopback  { return 302 http://127.0.0.1:18084/clean.html; }
    location = /redirect/decimal   { return 302 http://2130706433:18084/clean.html; }

    # oversized body (4 MiB, generated at container start into the WRITABLE
    # layer - the fixtures mount is read-only): over the fetch cap AND the
    # spill raw ceiling; expect a capped/truncated result, never a full read.
    location = /huge.bin {
        default_type application/octet-stream;
        alias /tmp/huge.bin;
    }

    # DNS rebinding is a Go-suite fixture (httptest + fake resolver flip,
    # web_guard_test.go Test22DNSRebindingBlockedPerHop); the docker side
    # keeps an honest endpoint for manual runs only.
    location = /rebind {
        default_type text/plain;
        return 200 'rebinding fixture: see internal/tools/web_guard_test.go Test22DNSRebindingBlockedPerHop\n';
    }
}
